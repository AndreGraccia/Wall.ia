name: Format radar implementation (temporary)

on:
  push:
    branches:
      - feat/radar-cobrancas-20261026
    paths:
      - "frontend/src/**"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/radar-cobrancas-20261026
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Apply Prettier to frontend source
        working-directory: frontend
        run: npx prettier --write src
      - name: Commit formatting changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src
          if git diff --cached --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git commit -m "style: format radar implementation [skip ci]"
          git push origin HEAD:feat/radar-cobrancas-20261026
