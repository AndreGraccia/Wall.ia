# Blueprint do Render: a API (Docker) e o PostgreSQL. O frontend fica na Vercel. Passo a passo em docs/deploy-producao.md.
# Nenhum segredo aqui: o Render liga o banco, gera as duas chaves e pede só o que tem "sync: false" (o e-mail).
databases:
  - name: wallia-db
    databaseName: wallia
    user: wallia
    # Banco gratuito: expira 30 dias depois de criado e não tem backup. Para uso real, plano pago ou Neon
    # (troque DATABASE_URL pela connection string do Neon).
    plan: free
    region: virginia
    # Só a rede interna do Render alcança o banco.
    ipAllowList: []

services:
  - type: web
    name: wallia-api
    runtime: docker
    plan: free
    # Mais perto do Brasil entre as regiões do Render.
    region: virginia
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    # Publicar é decisão de quem opera: nada sobe sozinho a cada commit.
    autoDeployTrigger: "off"
    # Readiness inclui o banco: o deploy só troca a versão quando a nova responde e alcança o PostgreSQL.
    healthCheckPath: /actuator/health/readiness
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: wallia-db
          property: connectionString
      # Poucas conexões: 512 MB de RAM no plano free.
      - key: SPRING_DATASOURCE_HIKARI_MAXIMUMPOOLSIZE
        value: "5"

      # Gerados pelo Render (Base64, 256 bits) e guardados no painel.
      - key: JWT_SECRET
        generateValue: true
      # Obrigatória (ADR 0014). Perder esta chave torna as descrições ilegíveis: copie do painel para um cofre.
      - key: DATA_ENCRYPTION_KEY
        generateValue: true

      # O navegador manda este Origin pelo rewrite da Vercel; o CORS do Spring recusa POST de qualquer outro.
      - key: FRONTEND_ORIGIN
        value: https://wallia-eight.vercel.app

      # SMTP do código de cadastro, os únicos valores que o Render pede. O plano free bloqueia as portas 25, 465
      # e 587: use a porta alternativa do provedor com STARTTLS (Brevo 2525, Resend 2587).
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_AUTH
        value: "true"
      - key: MAIL_STARTTLS
        value: "true"
      # Opcionais, adicionados depois pelo painel se quiser: VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY, VAPID_SUBJECT
      # (aviso no navegador) e GEMINI_API_KEY (texto da Análise).

      # A URL onrender.com é pública: só health fica exposto do actuator, e sem documentação da API.
      - key: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
        value: health
      - key: SPRINGDOC_API_DOCS_ENABLED
        value: "false"
      - key: SPRINGDOC_SWAGGER_UI_ENABLED
        value: "false"
      - key: LOGGING_STRUCTURED_FORMAT_CONSOLE
        value: ecs
      # 512 MB no plano free: sem isso a JVM usa só 25% da RAM para o heap.
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:MaxRAMPercentage=70 -XX:+UseSerialGC -Xss512k"
