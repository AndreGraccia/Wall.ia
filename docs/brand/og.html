<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Wall.ia OG 1200x630</title>
<!-- Fonte da imagem de compartilhamento (public/og.png). Gerar: python frontend/scripts/build-icons.py -->
<link rel="stylesheet" href="brand.css">
<style>
  body { width: 1200px; height: 630px; }
  .top { position: absolute; left: 64px; top: 56px; font-size: 30px; }
  .copy { position: absolute; left: 64px; top: 132px; width: 820px; }
  .headline { font-size: 68px; }
  .body { font-size: 26px; margin-top: 24px; max-width: 700px; }
  .chart { position: absolute; left: 0; bottom: 0; width: 1200px; height: 240px; }
</style>
</head>
<body>
  <div class="top wordmark">
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#15282E"/><line x1="3.5" y1="19" x2="28.5" y2="19" stroke="#5F8792" stroke-width="1.2" stroke-linecap="round"/><polyline points="15.5,11 20.5,24 25.5,12" fill="none" stroke="#A3B5FF" stroke-width="2.3" pathLength="100" stroke-dasharray="12 9" stroke-dashoffset="17.2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="6,8.5 10.5,16.5 15.5,11" fill="none" stroke="#EAF2F0" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="15.5" cy="11" r="2.7" fill="#FFD25E"/></svg>
    <span>Wall<span class="dot">.</span>ia</span>
  </div>
  <div class="copy">
    <h1 class="headline">Veja o futuro antes de mexer no dinheiro.</h1>
    <p class="body">Saldo projetado dia a dia, com o confirmado separado do <span class="estimate">estimado</span>. A Wall.ia avisa antes do negativo.</p>
  </div>
  <svg class="chart" viewBox="0 0 1200 240" aria-hidden="true">
    <polygon class="hole" points="660.6,140 690,180 790,196 806,140"/>
    <line class="waterline" x1="0" x2="1200" y1="140" y2="140"/>
    <text class="tick" x="64" y="130">R$ 0</text>
    <path class="past" d="M-10 70 L120 96 L210 60 L300 88 L390 52 L470 74"/>
    <path class="ahead" d="M470 74 L560 92 L640 112 L690 180 L790 196 L830 56 L960 80 L1080 62 L1210 86"/>
    <circle class="today" cx="470" cy="74" r="12"/>
    <text class="tick" x="470" y="40" text-anchor="middle">hoje</text>
    <text class="tick" x="676" y="214" text-anchor="end">fatura</text>
    <text class="tick" x="846" y="46">salário</text>
  </svg>
</body>
</html>
